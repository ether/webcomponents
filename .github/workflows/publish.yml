name: Publish to NPM

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.2.0, 1.0.0-beta.1)'
        required: true
        type: string

jobs:
  publish:
    name: Publish v${{ inputs.version }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
          scope: '@samtv12345'

      - run: pnpm install --frozen-lockfile

      - name: Set version
        run: |
          npm pkg set version="${{ inputs.version }}"
          ACTUAL_VERSION=$(node -p "require('./package.json').version")
          if [ "$ACTUAL_VERSION" != "${{ inputs.version }}" ]; then
            echo "Version update failed: expected ${{ inputs.version }}, got $ACTUAL_VERSION"
            exit 1
          fi

      - name: Type check
        run: pnpm tsc --noEmit

      - name: Build
        run: pnpm build

      # Trusted Publishing (OIDC): no NPM_TOKEN. Requires npm >= 11.5.1 and a
      # trusted publisher configured for this package on npmjs.com pointing at
      # this repo + workflow. npm authenticates via the id-token and attaches
      # build provenance automatically.
      - name: Update npm for trusted publishing
        run: npm install -g npm@latest
      - name: Publish
        run: npm publish --access public

      - name: Commit, tag & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "No package metadata changes to commit"
          else
            git commit -m "release: v${{ inputs.version }}"
            git push origin HEAD:main
          fi
          git tag "v${{ inputs.version }}"
          git push origin "v${{ inputs.version }}"
