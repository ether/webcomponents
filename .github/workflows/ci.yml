name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# One run per branch or PR: a new push cancels the old run of the same
# branch, never another branch's (Dependabot opens several at once).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Type Check & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The version comes from "packageManager" in package.json (pnpm 11).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Build library
        run: pnpm build

      - name: Build Storybook
        run: pnpm build-storybook

      - name: Upload Storybook artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: storybook-static

  test:
    name: Vitest Browser Tests
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      # The version comes from "packageManager" in package.json (pnpm 11).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        # Use the project-pinned Playwright (pnpm exec), not `pnpm dlx` which
        # fetches the latest Playwright and installs mismatched browser
        # revisions, leaving the pinned version's binary missing.
        run: pnpm exec playwright install --with-deps chromium

      - name: Run tests
        run: pnpm test

  deploy:
    name: Deploy Storybook
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [check, test]
    runs-on: ubuntu-latest
    # Pages deployments one after the other, never two at once.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
